name: Deploy GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/website/**'
      - '.github/workflows/pages.yml'
  # Allows publishing from the Actions tab without waiting for a push.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages (build_type=workflow) on first run instead of failing
          # when it hasn't been turned on in repo settings yet.
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/website

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
