name: CI

# Lint + test on every pull request and on release branches, so changes are
# gated before they reach main. Publishing stays in publish.yml.
on:
  pull_request:
    # Release branches are included because work lands on them first: a pull
    # request into release/0.9.0 used to report no checks at all, so lint,
    # tests and packaging never ran until after it was merged.
    branches: [ main, 'release/**' ]
  push:
    branches: [ 'release/**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: nikolareljin/ci-helpers/.github/workflows/node.yml@production
    with:
      node_version: "22"
      # Release sources are validated first, ahead of the ~10 minute VS Code
      # test run, and on the pull request rather than in publish.yml — which
      # runs only after a merge to main, where a rejected RELEASE_NOTES.md
      # blocks the release instead of the change that caused it.
      lint_command: |
        npm ci
        npm run check:release
        # A tag that already exists means this version was published: the
        # publish job would fail after the merge. Checked only on release
        # branches, where setting the version is the point; pull requests into
        # main are often docs or hotfixes that publish.yml skips anyway.
        target="${GITHUB_BASE_REF:-${GITHUB_REF_NAME:-}}"
        case "$target" in
          release/*)
            version="$(node -p "require('./package.json').version")"
            if [ -n "$(git tag -l "v$version")" ]; then
              echo "::error::v$version is already tagged. Bump VERSION, package.json and RELEASE_NOTES.md together."
              exit 1
            fi
            echo "v$version is not tagged yet."
            ;;
          *)
            echo "Not a release branch ($target); skipping the tag check."
            ;;
        esac
        npm run lint
      # vscode-test launches a real VS Code (Electron) instance, which needs a
      # virtual display on Linux. node_modules is already present from the lint
      # step, which runs first.
      test_command: "sudo apt-get update && sudo apt-get install -y xvfb && xvfb-run -a -s '-screen 0 1024x768x24' npm test"
      # The extension ships its sources directly, so there is nothing to compile
      # (the package.json "build" script targets a src/ directory that does not
      # exist). Packaging runs here anyway because `vsce package` is the only
      # step that validates @types/vscode against engines.vscode, and until now
      # it lived solely in publish.yml — which runs *after* a merge to main. A
      # dependency bump that raises @types/vscode past engines.vscode therefore
      # passed CI and broke publishing. This catches it on the pull request.
      build_command: "npx --yes @vscode/vsce@latest package --no-dependencies -o /tmp/leak-lock-ci.vsix"
