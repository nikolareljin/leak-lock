name: Publish VS Code Extension

on:
  push:
    branches: [ main ]
    # RELEASE_NOTES.md is a release source, not documentation: a merge that
    # only edits it still has to validate and publish. A blanket '*.md' skipped
    # exactly that case.
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'

  # default permissions remain minimal; elevate per-job

jobs:
  # Job to test the extension before publishing
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests in headless mode
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a -s '-screen 0 1024x768x24' npm test
        env:
          DISPLAY: ':99'
          CI: true

      - name: Run linter
        run: npm run lint

  # Job to build and publish the extension
  publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'nikolareljin' && endsWith(github.repository, '/leak-lock')
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Fetch all history for version calculation
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mask tokens
        run: |
          echo "::add-mask::${{ secrets.GITHUB_TOKEN }}"
          echo "::add-mask::${{ secrets.VSCE_PAT }}"
          echo "::add-mask::${{ secrets.OVSX_PAT }}"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install VSCE (VS Code Extension Manager)
        run: |
          # Install specific compatible version of vsce
          npm install -g @vscode/vsce@latest
          # Verify installation and show available options
          echo "VSCE version:"
          vsce --version
          echo "VSCE help:"
          vsce package --help || echo "Help command failed, continuing..."
          # Install Open VSX CLI
          npm install -g ovsx@latest
          echo "OVSX version:"
          ovsx --version

      # Runs first: it is the single place that checks VERSION against
      # package.json and validates RELEASE_NOTES.md, so nothing downstream
      # repeats those rules and drifts from them.
      - name: Validate release sources
        run: node tools/release-notes.js --check

      - name: Verify package.json structure
        run: |
          # Fields vsce needs that the release-source check does not cover.
          node -e "
            const pkg = require('./package.json');
            console.log('Package name:', pkg.name);
            console.log('Version:', pkg.version);
            console.log('Publisher:', pkg.publisher);
            console.log('Engine requirement:', pkg.engines?.vscode);
            if (!pkg.name || !pkg.version || !pkg.publisher) {
              throw new Error('Missing required package.json fields');
            }
          "

      - name: Get current version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          node -e "const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/; if (!semver.test(process.argv[1])) { throw new Error('package.json version must be strict SemVer like 0.9.0, with no wildcards or ranges.'); }" "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Check version tag is new
        # The version reaches the shell through the environment rather than
        # through ${{ }} expansion inside the script body.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # VERSION, package.json, and RELEASE_NOTES.md are source-controlled together.
          # A duplicate tag means the release version must be updated in a new commit.
          if [ -n "$(git tag -l "v$VERSION")" ]; then
            echo "Version $VERSION already exists. Update VERSION, package.json, and RELEASE_NOTES.md together."
            exit 1
          fi
          echo "Version $VERSION is new, will publish"

      - name: Generate release notes
        if: github.event_name == 'push'
        run: node tools/release-notes.js

      - name: Package extension
        run: |
          # Set NODE_OPTIONS to handle potential memory issues
          export NODE_OPTIONS="--max-old-space-size=4096"

          # No rm here: .vscodeignore already excludes test/** and test*.js, and
          # deleting files out of the checkout risked taking tracked sources with
          # them.

          # Package the extension (removed --verbose flag as it's not supported)
          echo "Packaging extension..."
          vsce package
          
          # List created packages
          echo "Created packages:"
          ls -la *.vsix
        env:
          NODE_ENV: production

      - name: Validate package
        run: |
          # Verify the package was created successfully
          VSIX_FILE=$(ls *.vsix | head -1)
          if [ ! -f "$VSIX_FILE" ]; then
            echo "Error: No .vsix file found"
            exit 1
          fi
          
          echo "Package created successfully: $VSIX_FILE"
          echo "Package size: $(du -h "$VSIX_FILE" | cut -f1)"
          
          # Test package contents (list files in package)
          echo "Package contents:"
          vsce ls || echo "vsce ls command not available, skipping content listing"

      - name: Publish to VS Code Marketplace
        if: github.event_name == 'push'
        run: |
          # Set NODE_OPTIONS for publishing
          export NODE_OPTIONS="--max-old-space-size=4096"
          
          # Check if PAT is available
          if [ -z "${{ secrets.VSCE_PAT }}" ]; then
            echo "Warning: VSCE_PAT secret not found, skipping marketplace publish"
            exit 0
          fi
          
          # Publish with retry logic (removed --verbose flag)
          for i in {1..3}; do
            echo "Publishing attempt $i..."
            if vsce publish --pat "${{ secrets.VSCE_PAT }}"; then
              echo "Published successfully!"
              break
            else
              echo "Publish attempt $i failed"
              if [ $i -lt 3 ]; then
                echo "Retrying in 30 seconds..."
                sleep 30
              else
                echo "All publish attempts failed"
                exit 1
              fi
            fi
          done
        env:
          NODE_ENV: production

      - name: Publish to Open VSX Registry
        if: github.event_name == 'push'
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          if [ -z "${{ secrets.OVSX_PAT }}" ]; then
            echo "Warning: OVSX_PAT secret not found, skipping Open VSX publish"
            exit 0
          fi
          VSIX_FILE=$(ls *.vsix | head -1)
          if [ ! -f "$VSIX_FILE" ]; then
            echo "Error: No .vsix file found"
            exit 1
          fi
          for i in {1..3}; do
            echo "Open VSX publish attempt $i..."
            if ovsx publish "$VSIX_FILE" -p "${{ secrets.OVSX_PAT }}"; then
              echo "Published to Open VSX successfully!"
              break
            else
              echo "Open VSX publish attempt $i failed"
              if [ $i -lt 3 ]; then
                echo "Retrying in 30 seconds..."
                sleep 30
              else
                echo "All Open VSX publish attempts failed"
                exit 1
              fi
            fi
          done
        env:
          NODE_ENV: production

      - name: Create Git Tag
        if: github.event_name == 'push'
        env:
          FINAL_VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Creating git tag v${FINAL_VERSION}"
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # --cleanup=verbatim: git tag defaults to --cleanup=strip, which drops
          # every line starting with the comment character. Without this the
          # annotated tag loses "## Release notes, vX.Y.Z" and every "## Added"
          # or "## Fixed" heading, leaving bare bullets.
          git tag -a "v${FINAL_VERSION}" --cleanup=verbatim -F .release-notes.md
          # Ensure remote is authenticated with GITHUB_TOKEN for pushing tags
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "v${FINAL_VERSION}"

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body_path: .release-notes.md
          draft: false
          prerelease: false
          files: "*.vsix"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Extension Package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: leak-lock-extension-v${{ steps.version.outputs.version }}
          path: "*.vsix"
          retention-days: 30
          compression-level: 6
